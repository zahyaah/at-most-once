services:
  - type: web
    name: warehouse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Must sit in the same region as the database. Every create makes several round trips and
    # each waiter polls every 15ms, so a cross-region hop multiplies latency rather than adding
    # to it. Singapore is Render's Asia-Pacific region.
    region: singapore
    # Runs SELECT 1 through the pool, so an instance that cannot reach the database fails the
    # check instead of reporting healthy while every request hangs.
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      # Free instances are small, and Aiven's free MySQL caps connections well below the
      # local default of 100.
      - key: DB_POOL_SIZE
        value: 15
      - key: DB_LEASE_POOL_SIZE
        value: 5
      - key: LOG_LEVEL
        value: info
      # Set in the Render dashboard, not here: secrets and the deployed UI origin.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Aiven rejects plaintext connections. DB_SSL_CA is the CA certificate from the Aiven
      # console, pasted whole including the BEGIN and END lines.
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
